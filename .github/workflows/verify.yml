name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "also run the long studies (03 modal/buckling, 04 fin, 05 bracket optimisation)"
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CalculiX and the Gmsh runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y calculix-ccx libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1
          ccx -v || true   # ccx prints its version and then exits 201
      - name: Install the package
        run: pip install -e ".[dev]"
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Quick verification projects (each script exits non-zero if any check fails)
        env:
          OMP_NUM_THREADS: "2"
        run: |
          for p in 01_cantilever_verification 02_plate_with_hole_stress_concentration 06_ai_solution_review 07_fatigue_life_estimation; do
            echo "::group::$p"; (cd projects/$p && python run.py); echo "::endgroup::"
          done
      - name: Long studies
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        env:
          OMP_NUM_THREADS: "2"
        run: |
          for p in 03_modal_and_buckling 04_pin_fin_heat_transfer 05_bracket_design_optimization; do
            echo "::group::$p"; (cd projects/$p && python run.py); echo "::endgroup::"
          done
      - name: Upload results produced in CI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            projects/*/results/**
            !projects/*/results/*.svg
